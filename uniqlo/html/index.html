<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIQLO</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,home,search,account_circle,shopping_cart,dehaze,arrow_forward_ios,arrow_back_ios"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="gnb-box">
          <h1 class="logo"><img src="../images/logo.png" alt="" /></h1>
          <nav class="gnb">
            <ul class="list">
              <li><a href="">WOMEN</a></li>
              <li><a href="">MEN</a></li>
              <li><a href="">KIDS</a></li>
              <li><a href="">BABY</a></li>
            </ul>
          </nav>
        </div>
        <!-- gnb-box end -->
        <div class="search-box">
          <div class="search">
            <input type="text" class="search-input" placeholder="검색어를 입력해주세요" />
            <button>
              <span class="material-symbols-outlined">search</span>
            </button>
          </div>
          <div class="util-menu">
            <a href=""><span class="material-symbols-outlined">favorite</span></a>
            <a href=""><span class="material-symbols-outlined">account_circle</span></a>
            <a href=""><span class="material-symbols-outlined">shopping_cart</span></a>
            <a href=""><span class="material-symbols-outlined">dehaze</span> </a>
          </div>
        </div>
      </div>
    </header>
    <!-- header end -->
    <div class="main-visual">
      <ul class="visual-list swiper-wrapper">
        <li class="visual visual01 swiper-slide"></li>
        <li class="visual visual02 swiper-slide"></li>
        <li class="visual visual03 swiper-slide"></li>
        <li class="visual visual04 swiper-slide"></li>
      </ul>
      <button class="btn btn-next">
        <span class="material-symbols-outlined"> arrow_forward_ios </span>
      </button>
      <button class="btn btn-prev">
        <span class="material-symbols-outlined"> arrow_back_ios </span>
      </button>
    </div>
    <script>
      const swiper = new Swiper(".main-visual", {
        loop: true,
        speed: 1000,
        effect: "fade",
        // Navigation arrows
        navigation: {
          nextEl: ".main-visual .btn-next",
          prevEl: ".main-visual .btn-prev",
        },
      });
    </script>
  </body>
</html>
